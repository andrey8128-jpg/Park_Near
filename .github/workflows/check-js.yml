
name: Park Near JS Syntax Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check backend JavaScript
        run: |
          node --check auth-server/app.js
          node --check auth-server/db.js

      - name: Check frontend JavaScript
        run: |
          for file in js/*.js; do
            node --check "$file"
          done

      - name: Check Service Worker
        run: node --check sw.js
