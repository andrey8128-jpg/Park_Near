<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ParkNear — Парковка без забот</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Основные стили -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Telegram WebApp (если используется) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Яндекс.Карты (API-ключ из Firebase Config) -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=AIzaSyATLX5t2lmibbuiSXL_sWu_JnFFTb-nMqU&lang=ru_RU" type="text/javascript"></script>

    <!-- Firebase SDK (необходим для работы с базой данных) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        /* Базовые сбросы и стили для body */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            touch-action: manipulation;
        }
        :root {
            --bg-primary: #F2F2F7;
            --bg-secondary: #FFFFFF;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --accent: #2B7574;
            --red: #D32F2F;
            --green: #2E7D32;
            --orange: #ED6C02;
            --gray: #8E8E93;
            --border-color: #E5E5EA;
            --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        .dark-theme {
            --bg-primary: #000000;
            --bg-secondary: #1C1C1E;
            --text-primary: #FFFFFF;
            --text-secondary: #8E8E93;
            --border-color: #2C2C2E;
            --card-shadow: 0 2px 12px rgba(255, 255, 255, 0.05);
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Остальные стили находятся в css/style.css */
    </style>
</head>
<body>

    <!-- ============ СПЛЕШ-ЭКРАН ============ -->
    <div id="splashScreen">
        <div class="splash-content">
            <div class="splash-logo">🚗</div>
            <div class="splash-title">ParkNear</div>
            <div class="splash-subtitle">Парковка без забот</div>
            <div class="splash-spinner"></div>
        </div>
    </div>

    <!-- ============ КАРТА ============ -->
    <div id="map"></div>

    <!-- ============ КРУЖОК СО СЧЁТЧИКОМ СВОБОДНЫХ МЕСТ ============ -->
    <div id="totalFreeCircle">
        <span id="totalFreeCount">0</span>
    </div>

    <!-- ============ КНОПКА ДОБАВЛЕНИЯ ПАРКОВКИ ============ -->
    <button id="addBtn" class="add-btn" aria-label="Добавить парковку">+</button>

    <!-- ============ КНОПКА ГЕОЛОКАЦИИ ============ -->
    <button id="geoBtn" class="geo-btn" aria-label="Определить местоположение">📍</button>

    <!-- ============ ПЕРЕКЛЮЧАТЕЛЬ СЛОЁВ КАРТЫ ============ -->
    <div id="layerSwitcher" class="layer-switcher" aria-label="Слои карты">
        🗺️
        <div id="layerMenu" class="layer-menu">
            <div class="layer-option" data-type="yandex#map" onclick="setMapType(this)">Схема</div>
            <div class="layer-option" data-type="yandex#satellite" onclick="setMapType(this)">Спутник</div>
            <div class="layer-option" data-type="yandex#hybrid" onclick="setMapType(this)">Гибрид</div>
        </div>
    </div>

    <!-- ============ НИЖНЯЯ ПАНЕЛЬ ============ -->
    <div id="panel" class="panel">
        <div class="panel-header">
            <span id="panelTitle">Главная</span>
            <button class="panel-close" onclick="closePanel()">✕</button>
        </div>
        <div id="panelContent" class="panel-content"></div>
        <div id="pullIndicator" class="pull-indicator"></div>
    </div>

    <!-- ============ НИЖНЕЕ МЕНЮ (ТАББАР) ============ -->
    <div class="tabBar">
        <div class="tab active" data-tab="home" onclick="showPanel('home')">
            <span class="tab-icon">🏠</span>
            <span class="tab-label">Главная</span>
        </div>
        <div class="tab" data-tab="search" onclick="showPanel('search')">
            <span class="tab-icon">🔍</span>
            <span class="tab-label">Поиск</span>
        </div>
        <div class="tab" data-tab="favorites" onclick="showPanel('favorites')">
            <span class="tab-icon">⭐</span>
            <span class="tab-label">Избранное</span>
        </div>
        <div class="tab" data-tab="profile" onclick="showPanel('profile')">
            <span class="tab-icon">👤</span>
            <span class="tab-label">Профиль</span>
        </div>
    </div>

    <!-- ============ ЦЕНТРАЛЬНОЕ МОДАЛЬНОЕ ОКНО ============ -->
    <div id="centerSheet" class="center-sheet">
        <div class="center-sheet-content" id="centerSheetContent">
            <button class="center-sheet-close" onclick="closeCenterSheet()">✕</button>
        </div>
    </div>

    <!-- ============ ОВЕРЛЕЙ АВТОРИЗАЦИИ ============ -->
    <div id="authOverlay" class="auth-overlay" style="display:none;">
        <div class="auth-container">
            <div class="auth-logo">🚗</div>
            <h2>Добро пожаловать в ParkNear</h2>
            <p>Войдите через Telegram, чтобы сохранять данные</p>
            <script async src="https://telegram.org/js/telegram-widget.js?24&v=1"
                data-telegram-login="parknear_bot"
                data-size="large"
                data-onauth="onTelegramAuth(user)"
                data-request-access="write">
            </script>
            <div style="margin:12px 0; color:var(--text-secondary);">— или —</div>
            <button class="guest-btn" onclick="continueAsGuest()">Продолжить как гость</button>
            <button class="close-auth-btn" onclick="closeAuthScreen()">✕</button>
        </div>
    </div>

    <!-- ============ ОНБОРДИНГ (обучение) ============ -->
    <div id="onboardingOverlay" class="onboarding-overlay" style="display:none;">
        <div class="onboarding-modal">
            <div id="onboardingSlide" class="onboarding-slide"></div>
            <div class="onboarding-progress">
                <div id="onboardingProgressFill" class="onboarding-progress-fill"></div>
            </div>
            <div id="onboardingDots" class="onboarding-dots"></div>
            <div class="onboarding-buttons">
                <button id="onboardingPrev" class="onboarding-btn">Назад</button>
                <button id="onboardingNext" class="onboarding-btn primary">Далее</button>
                <button id="onboardingSkip" class="onboarding-btn skip">✕</button>
            </div>
        </div>
    </div>

    <!-- ============ ТОСТ-УВЕДОМЛЕНИЯ ============ -->
    <div id="toast" class="toast"></div>

    <!-- ============ РАЗНЫЕ ОВЕРЛЕИ ============ -->
    <div id="addressPickerOverlay" class="overlay" style="display:none;">
        <div class="overlay-content">
            <div id="addressPickerMap" style="width:100%; height:300px;"></div>
            <div class="overlay-buttons">
                <button class="btn-secondary" onclick="cancelAddressPicker()">Отмена</button>
                <button class="btn-primary" onclick="saveAddressFromPicker()">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="labelPickerOverlay" class="overlay" style="display:none;">
        <div class="overlay-content">
            <h3>Выберите метку</h3>
            <div class="label-options">
                <button class="label-option" onclick="selectLabel('Дом')">🏠 Дом</button>
                <button class="label-option" onclick="selectLabel('Работа')">💼 Работа</button>
                <button class="label-option" onclick="selectLabel('Родственники')">👨‍👩‍👧‍👦 Родственники</button>
                <button class="label-option" onclick="selectLabel('Другое')">📍 Другое</button>
            </div>
            <button class="btn-secondary" onclick="cancelLabelPicker()">Отмена</button>
        </div>
    </div>

    <div id="addressEditorOverlay" class="overlay" style="display:none;">
        <div class="overlay-content">
            <h3>Редактировать адрес</h3>
            <input type="hidden" id="editAddrId">
            <div class="form-group">
                <label>Метка</label>
                <input type="text" id="editAddrLabel" class="input-field" placeholder="Дом, Работа...">
            </div>
            <div class="form-group">
                <label>Город</label>
                <input type="text" id="editAddrCity" class="input-field" placeholder="Москва">
            </div>
            <div class="form-group">
                <label>Улица</label>
                <input type="text" id="editAddrStreet" class="input-field" placeholder="Тверская">
            </div>
            <div class="form-group">
                <label>Номер дома</label>
                <input type="text" id="editAddrHouse" class="input-field" placeholder="15">
            </div>
            <div class="overlay-buttons">
                <button class="btn-secondary" onclick="closeAddressEditor()">Отмена</button>
                <button class="btn-primary" onclick="saveAddressChanges()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- ============ РЕДАКТОР АВТОМОБИЛЯ ============ -->
    <div id="carEditorOverlay" class="overlay" style="display:none;">
        <div class="overlay-content">
            <h3>Мой автомобиль</h3>
            <div class="form-group">
                <label>Марка</label>
                <select id="carBrandSelect" class="input-field" onchange="updateCarModelSelect()">
                    <option value="">Выберите марку</option>
                </select>
            </div>
            <div class="form-group">
                <label>Модель</label>
                <select id="carModelSelect" class="input-field">
                    <option value="">Выберите модель</option>
                </select>
            </div>
            <div class="form-group">
                <label>Цвет</label>
                <select id="carColorSelect" class="input-field">
                    <option value="">Выберите цвет</option>
                </select>
            </div>
            <div class="form-group">
                <label>Госномер</label>
                <input type="text" id="carPlateInput" class="input-field" placeholder="А123БВ 777">
            </div>
            <div class="overlay-buttons">
                <button class="btn-secondary" onclick="closeCarEditor()">Отмена</button>
                <button class="btn-primary" onclick="saveCarData()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- ============ ОВЕРЛЕЙ ВЫБОРА ГОРОДА ============ -->
    <div id="cityPickerOverlay" class="overlay" style="display:none;">
        <div class="overlay-content">
            <h3>Выберите город</h3>
            <div class="form-group">
                <label>Регион</label>
                <select id="cityPickerRegion" class="input-field" onchange="updateCityPickerCities()">
                    <option value="">Выберите регион</option>
                </select>
            </div>
            <div class="form-group">
                <label>Город</label>
                <select id="cityPickerCity" class="input-field">
                    <option value="">Выберите город</option>
                </select>
            </div>
            <div class="overlay-buttons">
                <button class="btn-secondary" onclick="closeCityPicker()">Отмена</button>
                <button class="btn-primary" onclick="applyCityFromPicker(document.getElementById('cityPickerCity').value)">Применить</button>
            </div>
        </div>
    </div>

    <!-- ============ ПОДКЛЮЧЕНИЕ МОДУЛЕЙ ============ -->
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/geolocation.js"></script>
    <script src="js/cluster.js"></script>
    <script src="js/markers.js"></script>
    <script src="js/parking.js"></script>
    <script src="js/ui/panels.js"></script>
    <script src="js/ui/home.js"></script>
    <script src="js/ui/search.js"></script>
    <script src="js/ui/profile.js"></script>
    <script src="js/ui/favorites.js"></script>
    <script src="js/services/route.js"></script>
    <script src="js/services/address.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
